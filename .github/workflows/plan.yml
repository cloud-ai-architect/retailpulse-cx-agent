name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/plan.yml"
      - ".github/workflows/apply.yml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    name: Plan (dev)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    # No `environment:` here, deliberately.
    #
    # Declaring a GitHub Environment changes the OIDC subject from
    # repo:ORG/REPO:ref:refs/heads/main to repo:ORG/REPO:environment:dev.
    # The deploy role's trust policy allows the ref form, so with an
    # environment declared every run failed at credential load with
    # "Could not load credentials from any providers" -- which reads like a
    # missing secret rather than a subject mismatch, and cost a while to find.
    #
    # Either add the environment subject to the trust policy or do not
    # declare one. The rest of this portfolio does not, so neither does this.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: retailpulse-plan-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=retailpulse-tfstate-dev" \
            -backend-config="region=ap-south-1" \
            -backend-config="dynamodb_table=retailpulse-tfstate-lock-dev" \
            -backend-config="key=retailpulse.tfstate"

      - name: Terraform plan
        id: plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -var-file=envs/dev.tfvars \
            -no-color \
            -out=tfplan

      - name: Show plan summary
        if: always()
        working-directory: infra/terraform
        run: |
          echo "### Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan | head -100 >> $GITHUB_STEP_SUMMARY

      - name: Post plan to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/tfplan', 'utf8');
            const summary = `### Terraform Plan
            \`\`\`
            ${plan.slice(0, 30000)}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary,
            });
