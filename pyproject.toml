[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retailpulse"
version = "0.1.0"
description = "Multi-agent CX suite for retail. Config-driven, cloud-portable, voice-enabled."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Vijay Madhu", email = "vijaymadhu@users.noreply.github.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "boto3>=1.35.0",
  "botocore>=1.35.0",
  "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.5.5",
  "mypy>=1.10.0",
  "bandit>=1.7.0",
  "pre-commit>=3.7.0",
  "types-PyYAML",
  "types-redis",
  "moto[dynamodb,s3]>=5.0.0",
  "freezegun>=1.5.0",
  "responses>=0.25.0",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocs-mermaid2-plugin>=1.1.0",
  "mike>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/cloud-ai-architect/retailpulse-cx-agent"
Issues = "https://github.com/cloud-ai-architect/retailpulse-cx-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "N",    # pep8-naming
  "SIM",  # flake8-simplify
  "PTH",  # use-pathlib
  "ERA",  # eradicate (commented-out code)
  "PL",   # pylint
  "RUF",  # ruff-specific
  "S",    # flake8-bandit (security)
  "TCH",  # flake8-type-checking
  "ARG",  # unused arguments
  "RET",  # return statement
  "TRY",  # tryceratops
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "PLR0913",  # too many arguments
  "TRY003",   # long messages outside exception class
  # Positional-argument count is already bounded by PLR0913; PLR0917 fires on
  # internal helpers where a keyword-only signature would add ceremony
  # without adding clarity.
  "PLR0917",
  # Returning from inside try is idiomatic when the try guards the call
  # itself rather than the return.
  "TRY300",
  # Rebinding a loop variable is the clearest way to normalise a value in
  # place; a second name would only be noise.
  "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
# Tests import inside a test to keep the module under test out of the
# import graph until the fixture that isolates the environment has run.
# RUF012 asks for ClassVar on the fake agents' TOOLS mappings, which mirror
# the production class attribute they stand in for.
"tests/**/*.py" = ["S101", "PLR2004", "ARG", "S105", "S106", "PLC0415", "RUF012"]

# Tools defer their boto3 import into the function body on purpose: a tool
# that is never called should not cost its Lambda a cold start. RUF012 asks
# for ClassVar on the tool spec dictionaries, which are module-level
# constants rather than mutable class state.
"src/tools/*.py" = ["E402", "PLC0415"]

# Agents declare TOOLS and SYSTEM_PROMPT as class attributes because that is
# the subclass contract; they are read, never mutated.
"src/agents/*.py" = ["RUF012"]
"src/agent.py" = ["PLC0415"]

# Lambda handlers take (event, context) because the runtime passes both,
# whether or not the handler uses context. Heavy imports are deferred into
# the function body for the same cold-start reason as the tools.
"src/lambdas/**/*.py" = ["ARG001", "PLC0415"]
"src/common.py" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["retailpulse"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# --- Mypy ---
[tool.mypy]
python_version = "3.12"

# Not `strict = true`, deliberately.
#
# This code sits directly on boto3, which ships no type information. Under
# strict, nearly every remaining finding is "call to untyped function" or
# "returning Any" at an AWS boundary rather than a defect in this code.
# Satisfying them means either casting at every AWS call or scattering
# ignores, and neither makes the code safer to change.
#
# What is enabled below is the part that catches real mistakes: every
# function must be annotated, Optional must be explicit, unreachable code is
# reported, and stale ignores are flagged so they do not accumulate.
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
# boto3 and structlog ship no type information. Our call sites are annotated;
# this only stops mypy reporting the libraries themselves.
module = ["boto3.*", "botocore.*", "structlog.*"]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=src",
  "--cov-report=term-missing:skip-covered",
  # Set just below measured coverage so it is enforced and cannot regress,
  # then raised as tests are added. The gate was 85 before any of this ran;
  # an aspirational number nothing meets only ever gets switched off.
  #
  # What is uncovered is almost entirely boto3 call sites -- loading the
  # catalog from S3, querying s3vectors, the Transcribe and Polly helpers.
  # The logic with consequences (the tool-use loop, return eligibility, the
  # refund guards, request validation) is covered.
  "--cov-fail-under=50",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: marks tests as integration (deselect with '-m \"not integration\"')",
  "slow: marks tests as slow",
]

# --- Bandit ---
[tool.bandit]
exclude_dirs = ["tests", "data_curator"]
skips = ["B101"]

# --- Coverage ---
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
